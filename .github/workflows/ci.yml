name: ci

# PR と main への push: 検査して pak と配布の zip を作る（artifact に置く）。
# v[0-9]* のタグ: 同じものを作り、zip を添えた Release を下書きで作る。説明は手で書いて公開する。
# 道具の版は ci.env（workflow に直に書かない）。
on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 道具の版を読む
        run: |
          grep -E '^[A-Z0-9_]+=' ci.env >> "$GITHUB_ENV"
          grep -qE '^PYTHON_VERSION=.+' ci.env && grep -qE '^MAKEOBJ_TAG=.+' ci.env

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # 小さい（約 120KB）ので、キャッシュせず毎回取る
      - name: makeobj を用意する
        run: |
          bash tools/ci/setup_makeobj.sh "$MAKEOBJ_TAG" "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - run: pip install -r tools/requirements.txt

      # menuconf.tab などは、書き方を誤っても本体が警告を出さない。ここで止める
      - name: 設定ファイルの書き方を検査する
        run: python -X utf8 tools/lint_config.py

      - name: datgen の検査
        run: python -X utf8 -m unittest discover -s tools -p "test_*.py"

      # makeobj が警告（Warning）か誤り（ERROR）を出したら build.py が失敗にする
      - name: pak を組む
        run: python -X utf8 tools/build.py

      - name: 配布の zip を作る
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          python -X utf8 tools/package.py "$v"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pak256-zip
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: pak256-zip
          path: dist

      # 下書きで作る。説明は手で書いてから公開する。タグに - が付くもの（v0.0.0-test など）はプレリリースにする
      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/*.zip -R "$GITHUB_REPOSITORY" --draft $pre --verify-tag \
            --title "$TAG" --notes "【要編集】説明を手で書いてから公開する"
